<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ryan Marr</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/font.css">
    <style>
        :root {
            --navy: #071f3d;
            --text: #152536;
        }

        body {
            margin: 0;
            font-family: 'Lato', Verdana, Helvetica, sans-serif;
            font-size: 16px;
            color: var(--text);
            background: #ffffff;
        }

        header {
            background: var(--navy);
        }

        .site-nav {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand,
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }

        .brand {
            font-size: 1.35rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .brand:hover,
        .nav-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .hero {
            background: var(--navy);
            color: #ffffff;
            padding: 72px 0;
        }

        .profile {
            display: grid;
            grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
            gap: 48px;
            align-items: center;
        }

        .profile img {
            width: 100%;
            max-width: 220px;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 2.4rem;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 18px;
            font-size: 1.1rem;
            color: #d8e5f7;
        }

        .contact,
        .links {
            margin: 12px 0 0;
        }

        .hero a {
            color: #ffffff;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .links img {
            width: 16px;
            height: 16px;
            vertical-align: middle;
        }

        .content {
            padding: 56px 0;
        }

        .content h2 {
            margin: 0 0 16px;
            color: var(--navy);
            font-size: 2rem;
            font-weight: 700;
        }

        .content p {
            margin: 0;
            font-size: 1.15rem;
        }

        @media (max-width: 700px) {
            .site-nav,
            .profile {
                display: block;
            }

            .nav-links {
                margin-top: 12px;
                gap: 16px;
            }

            .profile img {
                margin-bottom: 28px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container site-nav">
            <a class="brand" href="index.html">Ryan Marr</a>
            <nav class="nav-links" aria-label="Primary navigation">
                <a href="resume.html">Resume</a>
                <a href="projects.html">Projects</a>
                <a href="essay.html">Essay</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container profile">
                <img src="imgs/profile.jpeg" alt="Ryan Marr">
                <div>
                    <h1>Ryan Marr</h1>
                    <p class="subtitle">Machine Learning Engineer and Researcher</p>
                    <p class="contact"><a href="mailto:r.marr747@gmail.com">r.marr747@gmail.com</a></p>
                    <p class="links">
                        <img src="imgs/linkedin.svg" alt="LinkedIn">
                        <a href="https://www.linkedin.com/in/ryan-marr-8b88a8170/">LinkedIn</a>
                        <span>/</span>
                        <img src="imgs/x-logo.svg" alt="X">
                        <a href="https://x.com/statespacedout">@statespacedout</a>
                    </p>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container">
                <h2>About Me</h2>
                <p>Hello</p>
            </div>
        </section>
    </main>
</body>
</html>
