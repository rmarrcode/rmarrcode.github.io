<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 264" width="700" height="264" role="img" aria-label="Latent Policy Network system diagram">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
  </defs>
  <g font-family="Baskerville, Georgia, serif" fill="#1a1a1a">
    <!-- trainable agent -->
    <rect x="330" y="22" width="355" height="232" rx="6" fill="none" stroke="#8a8a80" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="342" y="246" font-size="11" font-style="italic" fill="#5c5c57">agent, trained end-to-end with PPO</text>

    <g fill="#fffffa" stroke="#1a1a1a" stroke-width="1.2">
      <rect x="20" y="40" width="130" height="60"/>
      <rect x="180" y="40" width="120" height="60"/>
      <rect x="350" y="40" width="130" height="60"/>
      <rect x="590" y="40" width="80" height="60"/>
      <rect x="520" y="170" width="130" height="60"/>
      <rect x="340" y="170" width="140" height="60"/>
      <circle cx="540" cy="70" r="16"/>
    </g>

    <!-- recent-history window -->
    <g fill="#fffffa" stroke="#3c3c38" stroke-width="1">
      <rect x="192" y="52" width="10" height="16"/><rect x="204" y="52" width="10" height="16"/><rect x="216" y="52" width="10" height="16"/><rect x="228" y="52" width="10" height="16"/>
      <rect x="240" y="52" width="10" height="16"/><rect x="252" y="52" width="10" height="16"/><rect x="264" y="52" width="10" height="16"/><rect x="276" y="52" width="10" height="16" fill="#3c3c38"/>
    </g>

    <text x="85" y="66" font-size="14" text-anchor="middle">Environment</text>
    <text x="85" y="84" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5c5c57">opponent, hidden style</text>
    <text x="240" y="88" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5c5c57">last 12 observations</text>
    <text x="415" y="66" font-size="14" text-anchor="middle">Context encoder</text>
    <text x="415" y="84" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5c5c57">GRU · attention · mean</text>
    <text x="540" y="75" font-size="15" font-style="italic" text-anchor="middle">z</text>
    <text x="630" y="66" font-size="14" text-anchor="middle">Critic</text>
    <text x="630" y="84" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5c5c57">V(o, z)</text>
    <text x="585" y="196" font-size="14" text-anchor="middle">Weight generator</text>
    <text x="585" y="214" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5c5c57">hypernetwork</text>
    <text x="410" y="196" font-size="14" text-anchor="middle">Generated actor</text>
    <text x="410" y="214" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5c5c57">π(a | o; θ)</text>

    <g fill="none" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)">
      <path d="M150 70 H178"/>
      <path d="M300 70 H348"/>
      <path d="M480 70 H522"/>
      <path d="M556 70 H588"/>
      <path d="M540 86 V168"/>
      <path d="M520 200 H482"/>
      <path d="M110 100 V185 H338"/>
      <path d="M340 215 H50 V102"/>
    </g>
    <text x="501" y="193" font-size="14" font-style="italic" text-anchor="middle">θ</text>
    <text x="220" y="179" font-size="11" font-style="italic" fill="#5c5c57">observation o</text>
    <text x="150" y="231" font-size="11" font-style="italic" fill="#5c5c57">action a</text>
  </g>
</svg>
